<div class="appointment-form-container">
  <h2>{{ appointmentId ? 'Editar Consulta' : 'Nova Consulta' }}</h2>

  <form [formGroup]="appointmentForm" (ngSubmit)="onSubmit()">

    <label>
      Paciente ID
      <input formControlName="patient_id" type="number" />
    </label>

    <label>
      Médico ID
      <input formControlName="doctor_id" type="number" />
    </label>

    <label>
      Especialidade
      <input formControlName="specialty" type="text" />
    </label>

    <label>
      Data
      <input formControlName="date" type="date" />
    </label>

    <label>
      Hora
      <input formControlName="time" type="time" />
    </label>

    <label>
      Motivo
      <input formControlName="reason" type="text" />
    </label>

    <label>
      Observações
      <textarea formControlName="notes"></textarea>
    </label>

    <label>
      Status
      <select formControlName="status">
        <option value="scheduled">Agendada</option>
        <option value="completed">Concluída</option>
        <option value="canceled">Cancelada</option>
      </select>
    </label>

    <div class="buttons">
      <button type="submit" [disabled]="loading">Salvar</button>
      <button type="button" (click)="cancel()" [disabled]="loading">Cancelar</button>
    </div>

    <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
  </form>
</div>
