<div class="appointments-container">
  <h2>Consultas</h2>

  <!-- =================== BOTÕES DE AÇÃO =================== -->
  <div style="display: flex; justify-content: end; width: 100%; padding-block: 10px">
    <!-- Botão para criar nova consulta -->
    <button mat-icon-button color="primary" routerLink="/appointments/new" aria-label="Nova consulta">
      <mat-icon>add</mat-icon>
    </button>

    <!-- Botão para recarregar lista de consultas -->
    <button mat-icon-button color="primary" (click)="loadAppointments()" aria-label="Recarregar consultas">
      <mat-icon>refresh</mat-icon>
    </button>
  </div>

  <!-- =================== COMPONENTE TABLE (FILHO) =================== -->
  <!-- Aqui o componente filho recebe:
       - columns: configuração das colunas
       - data: array de consultas
       - loading: estado de carregamento
       - errorMessage: mensagem de erro
       - emptyMessage: mensagem caso não haja dados -->
  <app-table [columns]="columns" [data]="appointments" [loading]="loading" [errorMessage]="errorMessage"
    emptyMessage="Nenhuma consulta encontrada.">

    <!-- =================== TEMPLATE CUSTOMIZADO PARA COLUNAS =================== -->
    <!-- Este template será injetado no TableComponent via ContentChild -->
    <!-- Cada célula de coluna verifica se existe template para customização -->
    <ng-template #customTemplates let-row let-key="key">
      <ng-container [ngSwitch]="key">
        <!-- Exibe o nome do paciente em vez do ID -->
        <ng-container *ngSwitchCase="'patient_id'">{{ getPatientName(row.patient_id) }}</ng-container>

        <!-- Exibe o nome do médico em vez do ID -->
        <ng-container *ngSwitchCase="'doctor_id'">{{ getDoctorName(row.doctor_id) }}</ng-container>

        <!-- Formata a data da consulta -->
        <ng-container *ngSwitchCase="'date'">{{ row.date | date:'dd/MM/yyyy' }}</ng-container>

        <!-- Formata o status da consulta -->
        <ng-container *ngSwitchCase="'status'">
          {{ row.status === 'scheduled' ? 'Agendada' :
          (row.status === 'completed' ? 'Concluída' : 'Cancelada') }}
        </ng-container>

        <!-- Padrão: exibe valor direto do objeto -->
        <ng-container *ngSwitchDefault>{{ row[key] }}</ng-container>
      </ng-container>
    </ng-template>

    <!-- =================== TEMPLATE CUSTOMIZADO PARA AÇÕES =================== -->
    <!-- Este template também é injetado no TableComponent via ContentChild -->
    <!-- Ele será renderizado na coluna 'acoes' para cada linha -->
    <ng-template #actionsTemplate let-appointment>
      <!-- Botão para editar a consulta -->
      <button mat-icon-button color="primary" [routerLink]="['/appointments/edit', appointment.id]">
        <mat-icon>edit</mat-icon>
      </button>

      <!-- Botão para deletar a consulta -->
      <button mat-icon-button color="warn" (click)="deleteAppointment(appointment.id)">
        <mat-icon>delete</mat-icon>
      </button>
    </ng-template>

  </app-table>
</div>
