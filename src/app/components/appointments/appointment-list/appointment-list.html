<div class="appointments-container">
  <h2>Consultas</h2>
  <button routerLink="/appointments/new">Nova Consulta</button>

  <p *ngIf="loading">Carregando consultas...</p>
  <p *ngIf="errorMessage" class="error">{{ errorMessage }}</p>

  <table *ngIf="!loading && appointments.length > 0">
    <thead>
      <tr>
        <th>ID</th>
        <th>Paciente ID</th>
        <th>Data e Hora</th>
        <th>Médico</th>
        <th>Especialidade</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let appointment of appointments">
        <td>{{ appointment.id }}</td>
        <td>{{ appointment.patient_id }}</td>
        <td>{{ appointment.date | date: 'dd/MM/yyyy HH:mm' }}</td>
        <td>{{ appointment.doctor }}</td>
        <td>{{ appointment.specialty }}</td>
        <td>
          <button [routerLink]="['/appointments/edit', appointment.id]">Editar</button>
          <button (click)="deleteAppointment(appointment.id)">Deletar</button>
        </td>
      </tr>
    </tbody>
  </table>

  <p *ngIf="!loading && appointments.length === 0">Nenhuma consulta encontrada.</p>
</div>
