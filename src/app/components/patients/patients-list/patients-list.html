<div class="patients-container">
  <h2>Pacientes</h2>
  <div style="display: flex; justify-content: end; width: 100%; padding-block: 10px">
    <!-- Botão de adicionar -->
    <button mat-icon-button color="primary" routerLink="/patients/new" aria-label="Nova consulta">
      <mat-icon>add</mat-icon>
    </button>

    <!-- Botão de recarregar -->
    <button mat-icon-button color="primary" (click)="loadPatients()" aria-label="Recarregar consultas">
      <mat-icon>refresh</mat-icon>
    </button>
  </div>

  @if(loading){
  <p>Carregando pacientes...</p>
  }

  @if(errorMessage){
  <p class="error">{{ errorMessage }}</p>
  }

  <table mat-table [dataSource]="patients" class="mat-elevation-z8" *ngIf="!loading && patients.length > 0">

    <!-- ID -->
    <ng-container matColumnDef="nome">
      <th mat-header-cell *matHeaderCellDef style="font-weight: bold">Nome</th>
      <td mat-cell *matCellDef="let patient">{{ patient.name }}</td>
    </ng-container>

    <!-- CPF -->
    <ng-container matColumnDef="cpf">
      <th mat-header-cell *matHeaderCellDef style="font-weight: bold">CPF</th>
      <td mat-cell *matCellDef="let patient">{{ patient.cpf }}</td>
    </ng-container>

    <!-- TELEFONE -->
    <ng-container matColumnDef="telefone">
      <th mat-header-cell *matHeaderCellDef style="font-weight: bold">Telefone</th>
      <td mat-cell *matCellDef="let patient">{{ patient.phone }}</td>
    </ng-container>

    <!-- EMAIL -->
    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef style="font-weight: bold">Email</th>
      <td mat-cell *matCellDef="let patient">{{ patient.email }}</td>
    </ng-container>

    <!-- CIDADE / ESTADO -->
    <ng-container matColumnDef="cidadeEstado">
      <th mat-header-cell *matHeaderCellDef style="font-weight: bold">Cidade / Estado</th>
      <td mat-cell *matCellDef="let patient">{{ patient.city }} / {{ patient.state }}</td>
    </ng-container>

    <!-- Ações -->
    <ng-container matColumnDef="acoes">
      <th mat-header-cell *matHeaderCellDef style="font-weight: bold">Ações</th>
      <td mat-cell *matCellDef="let patient" style="display: flex; justify-content: center;">
        <button mat-icon-button color="primary" [routerLink]="['/patients/edit', patient.id]">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="deletePatient(patient.id)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="['nome','cpf','telefone','email','cidadeEstado','acoes']"></tr>
    <tr mat-row *matRowDef="let row; columns: ['nome','cpf','telefone','email','cidadeEstado','acoes'];">
    </tr>
  </table>

  <p *ngIf="!loading && patients.length === 0">Nenhum paciente encontrado.</p>
</div>
