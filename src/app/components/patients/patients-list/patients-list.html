<div class="patients-container">
  <h2>Pacientes</h2>
  <button routerLink="/patients/new">Novo Paciente</button>

  <p *ngIf="loading">Carregando pacientes...</p>
  <p *ngIf="errorMessage" class="error">{{ errorMessage }}</p>

  <table *ngIf="!loading && patients.length > 0">
    <thead>
      <tr>
        <th>Nome</th>
        <th>CPF</th>
        <th>Telefone</th>
        <th>Especialidade</th>
        <th>Data Consulta</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let p of patients">
        <td>{{ p.name }}</td>
        <td>{{ p.cpf }}</td>
        <td>{{ p.phone }}</td>
        <td>{{ p.specialty }}</td>
        <td>{{ p.service_date | date: 'dd/MM/yy' }}</td>
        <td>
          <button [routerLink]="['/patients/edit', p.id]">Editar</button>
          <button (click)="deletePatient(p.id)">Deletar</button>
        </td>
      </tr>
    </tbody>
  </table>

  <p *ngIf="!loading && patients.length === 0">Nenhum paciente encontrado.</p>
</div>
